<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload de Arquivos - webserv</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #333;
            font-size: 2em;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 1em;
        }

        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 60px 20px;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
            background: #f8f9ff;
        }

        .upload-area:hover {
            border-color: #764ba2;
            background: #f0f2ff;
            transform: translateY(-5px);
        }

        .upload-area.dragover {
            border-color: #764ba2;
            background: #e8ebff;
            transform: scale(1.02);
        }

        .upload-icon {
            font-size: 4em;
            color: #667eea;
            margin-bottom: 20px;
        }

        .upload-text {
            color: #333;
            font-size: 1.2em;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .upload-hint {
            color: #999;
            font-size: 0.9em;
        }

        #fileInput {
            display: none;
        }

        .file-info {
            margin-top: 20px;
            padding: 15px;
            background: #f0f2ff;
            border-radius: 10px;
            display: none;
        }

        .file-info.show {
            display: block;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .file-name {
            color: #333;
            font-weight: 600;
            margin-bottom: 5px;
            word-break: break-all;
        }

        .file-size {
            color: #666;
            font-size: 0.9em;
        }

        .buttons {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }

        .btn {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-upload {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-upload:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-upload:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-clear {
            background: #e0e0e0;
            color: #666;
        }

        .btn-clear:hover {
            background: #d0d0d0;
        }

        .progress-container {
            margin-top: 20px;
            display: none;
        }

        .progress-container.show {
            display: block;
        }

        .progress-bar {
            width: 100%;
            height: 30px;
            background: #f0f0f0;
            border-radius: 15px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            width: 0%;
            transition: width 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
        }

        .message {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            font-weight: 600;
            display: none;
        }

        .message.show {
            display: block;
            animation: slideDown 0.3s ease;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .file-list {
            margin-top: 30px;
        }

        .file-list-title {
            color: #333;
            font-size: 1.2em;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .uploaded-file {
            padding: 10px 15px;
            background: #f8f9ff;
            border-radius: 8px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .uploaded-file-name {
            color: #333;
            font-weight: 500;
        }

        .uploaded-file-time {
            color: #999;
            font-size: 0.85em;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="back">
            <span>←</span> Voltar
        </a>
        <div class="header">
            <h1>📤 Upload de Arquivos</h1>
            <p>Arraste e solte seu arquivo ou clique para selecionar</p>
        </div>

        <div class="upload-area" id="uploadArea">
            <div class="upload-icon">☁️</div>
            <div class="upload-text">Clique aqui ou arraste seu arquivo</div>
            <div class="upload-hint">Tamanho máximo: Ver arquivo de configuração</div>
        </div>

        <input type="file" id="fileInput" multiple>

        <div class="file-info" id="fileInfo">
            <div class="file-name" id="fileName">Nenhum arquivo selecionado</div>
            <div class="file-size" id="fileSize"></div>
        </div>

        <div class="buttons">
            <button class="btn btn-upload" id="uploadBtn" disabled>
                📤 Enviar Arquivo
            </button>
            <button class="btn btn-clear" id="clearBtn">
                🗑️ Limpar
            </button>
        </div>

        <div class="progress-container" id="progressContainer">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill">0%</div>
            </div>
        </div>

        <div class="message" id="message"></div>

        <div class="file-list" id="fileList" style="display: none;">
            <div class="file-list-title">📁 Arquivos Enviados</div>
            <div id="uploadedFiles"></div>
        </div>
    </div>

    <script>
    const uploadArea = document.getElementById('uploadArea');
    const fileInput = document.getElementById('fileInput');
    const fileInfo = document.getElementById('fileInfo');
    const fileName = document.getElementById('fileName');
    const fileSize = document.getElementById('fileSize');
    const uploadBtn = document.getElementById('uploadBtn');
    const clearBtn = document.getElementById('clearBtn');
    const progressContainer = document.getElementById('progressContainer');
    const progressFill = document.getElementById('progressFill');
    const message = document.getElementById('message');
    const fileList = document.getElementById('fileList');
    const uploadedFiles = document.getElementById('uploadedFiles');

    let selectedFile = null;
    let uploadedFilesList = [];

    // Click na área de upload
    uploadArea.addEventListener('click', () => {
        fileInput.click();
    });

    // Seleção de arquivo
    fileInput.addEventListener('change', (e) => {
        if (e.target.files.length > 0) {
            handleFile(e.target.files[0]);
        }
    });

    // Drag and Drop
    uploadArea.addEventListener('dragover', (e) => {
        e.preventDefault();
        uploadArea.classList.add('dragover');
    });

    uploadArea.addEventListener('dragleave', () => {
        uploadArea.classList.remove('dragover');
    });

    uploadArea.addEventListener('drop', (e) => {
        e.preventDefault();
        uploadArea.classList.remove('dragover');
        
        if (e.dataTransfer.files.length > 0) {
            handleFile(e.dataTransfer.files[0]);
        }
    });

    // 📌 Finalizando handleFile()
    function handleFile(file) {
        selectedFile = file;

        fileName.textContent = file.name;
        fileSize.textContent = (file.size / (1024 * 1024)).toFixed(2) + " MB";

        fileInfo.classList.add('show');
        uploadBtn.disabled = false;
    }

    // 📤 Enviar arquivo para o servidor
    uploadBtn.addEventListener('click', () => {
        if (!selectedFile) return;

        const formData = new FormData();
        formData.append("file", selectedFile);

        progressContainer.classList.add('show');
        progressFill.style.width = "0%";
        progressFill.textContent = "0%";

        const xhr = new XMLHttpRequest();
        xhr.open("POST", "/upload");  // 🔥 Rota do teu webserv

        // Atualizar barra de progresso
        xhr.upload.addEventListener("progress", (e) => {
            if (e.lengthComputable) {
                const percent = Math.round((e.loaded / e.total) * 100);
                progressFill.style.width = percent + "%";
                progressFill.textContent = percent + "%";
            }
        });

        xhr.onload = () => {
            if (xhr.status >= 200 && xhr.status < 300) {
                showMessage("Arquivo enviado com sucesso! 🤘", "success");
                saveUploadedFile(selectedFile.name);

                resetSelection(false); // não limpar lista
            } else {
                showMessage("❌ Erro ao enviar arquivo (" + xhr.status + ")", "error");
            }
        };

        xhr.onerror = () => {
            showMessage("❌ Erro de conexão com o servidor!", "error");
        };

        xhr.send(formData);
    });

    // 🗑️ Botão limpar
    clearBtn.addEventListener('click', () => {
        resetSelection(true);
    });

    function resetSelection(clearList) {
        selectedFile = null;
        fileInput.value = "";
        uploadBtn.disabled = true;
        fileInfo.classList.remove('show');

        if (clearList) {
            uploadedFilesList = [];
            uploadedFiles.innerHTML = "";
            fileList.style.display = "none";
        }
    }

    // ✔ Mostrar mensagem
    function showMessage(text, type) {
        message.textContent = text;
        message.className = "message show " + type;

        setTimeout(() => {
            message.classList.remove("show");
        }, 3000);
    }

    // 📁 Guardar arquivo na lista
    function saveUploadedFile(name) {
        const time = new Date().toLocaleString();

        uploadedFilesList.push({ name, time });

        fileList.style.display = "block";

        const div = document.createElement("div");
        div.classList.add("uploaded-file");
        div.innerHTML = `
            <span class="uploaded-file-name">${name}</span>
            <span class="uploaded-file-time">${time}</span>
        `;

        uploadedFiles.appendChild(div);
    }

</script>

</body>
</html>
