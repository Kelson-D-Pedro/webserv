<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Página de Teste</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0f1e3d, #003d82);
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
    }

    .container {
      max-width: 700px;
      text-align: center;
      padding: 3rem;
      animation: fadeUp 0.8s ease forwards;
      opacity: 0;
      transform: translateY(30px);
    }

    @keyframes fadeUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .badge {
      display: inline-block;
      background: rgba(255,255,255,0.15);
      padding: 0.4rem 1rem;
      border-radius: 30px;
      font-size: 0.85rem;
      margin-bottom: 1rem;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 1rem;
    }

    p {
      font-size: 1.1rem;
      opacity: 0.9;
      line-height: 1.8;
      margin-bottom: 2.5rem;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1.5rem;
    }

    .card {
      background: rgba(255,255,255,0.1);
      padding: 1.8rem;
      border-radius: 14px;
      transition: 0.3s;
      backdrop-filter: blur(6px);
    }

    .card:hover {
      transform: translateY(-6px);
      background: rgba(255,255,255,0.18);
    }

    .card h3 {
      margin-bottom: 0.6rem;
    }

    .card span {
      font-size: 0.9rem;
      opacity: 0.8;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="badge">Rota de Teste</div>
    <h1>Teste Concluído</h1>
    <p>
      Esta página serve como destino para redirecionamentos
      e validações do comportamento HTTP do WebServer.
    </p>

    <div class="cards">
      <div class="card">
        <h3>Redirecionamento</h3>
        <span>HTTP 301 / 302</span>
      </div>

      <div class="card">
        <h3>Headers</h3>
        <span>Validação de resposta</span>
      </div>

      <div class="card">
        <h3>Estado</h3>
        <span>Página carregada com sucesso</span>
      </div>
    </div>
  </div>
</body>
</html>
