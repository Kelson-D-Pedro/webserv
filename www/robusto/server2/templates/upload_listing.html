<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Uploads - C de Çerver</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
        min-height: 100vh;
        color: #333;
      }
      .header {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
        padding: 1.5rem 0;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      }
      .header .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 2rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .logo {
        font-size: 1.8rem;
        font-weight: 700;
        background: linear-gradient(45deg, #3498db, #2980b9);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        text-decoration: none;
      }
      .breadcrumb {
        color: #666;
        font-size: 0.9rem;
      }
      .breadcrumb a {
        color: #3498db;
        text-decoration: none;
      }
      .main-container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 3rem 2rem;
      }
      .page-title {
        text-align: center;
        margin-bottom: 3rem;
      }
      .page-title h1 {
        font-size: 3rem;
        color: white;
        margin-bottom: 1rem;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
      }
      .page-title .icon {
        font-size: 4rem;
        margin-bottom: 1rem;
        display: block;
        filter: drop-shadow(2px 2px 4px rgba(0, 0, 0, 0.3));
      }
      .page-title p {
        color: rgba(255, 255, 255, 0.9);
        font-size: 1.1rem;
        max-width: 600px;
        margin: 0 auto;
        line-height: 1.6;
      }
      .uploads-section {
        background: rgba(255, 255, 255, 0.95);
        border-radius: 20px;
        padding: 3rem;
        margin-bottom: 2rem;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      }
      .file-item {
        display: flex;
        align-items: center;
        padding: 1rem;
        border: 1px solid #e9ecef;
        border-radius: 10px;
        margin-bottom: 1rem;
        background: white;
        transition: all 0.3s ease;
      }
      .file-item:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
      }
      .file-icon {
        font-size: 2rem;
        margin-right: 1rem;
      }
      .file-details {
        flex: 1;
      }
      .file-name {
        font-weight: 600;
        color: #2c3e50;
      }
      .file-info {
        color: #7f8c8d;
        font-size: 0.9rem;
      }
      .file-actions {
        display: flex;
        gap: 0.5rem;
      }
      .btn-download {
        background: #3498db;
        color: white;
        padding: 0.5rem;
        border-radius: 5px;
        text-decoration: none;
        transition: all 0.3s ease;
      }
      .btn-download:hover {
        background: #2980b9;
      }
      .empty-state {
        text-align: center;
        padding: 3rem 2rem;
      }
      .empty-icon {
        font-size: 5rem;
        color: #bdc3c7;
        margin-bottom: 1rem;
      }
      .empty-title {
        font-size: 1.5rem;
        color: #2c3e50;
        margin-bottom: 1rem;
        font-weight: 600;
      }
      .empty-description {
        color: #7f8c8d;
        margin-bottom: 2rem;
        line-height: 1.6;
      }
      .action-buttons {
        display: flex;
        gap: 1rem;
        justify-content: center;
        flex-wrap: wrap;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 1rem 2rem;
        border-radius: 50px;
        text-decoration: none;
        font-weight: 600;
        transition: all 0.3s ease;
      }
      .btn-primary {
        background: linear-gradient(45deg, #3498db, #2980b9);
        color: white;
        box-shadow: 0 5px 15px rgba(52, 152, 219, 0.3);
      }
      .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(52, 152, 219, 0.4);
      }
      .btn-secondary {
        background: white;
        color: #3498db;
        border: 2px solid #3498db;
      }
      .btn-secondary:hover {
        background: #3498db;
        color: white;
        transform: translateY(-2px);
      }
      .footer {
        background: rgba(0, 0, 0, 0.2);
        color: rgba(255, 255, 255, 0.8);
        text-align: center;
        padding: 2rem;
        backdrop-filter: blur(10px);
      }
    </style>
  </head>
  <body>
    <header class="header">
      <div class="container">
        <a href="/" class="logo">C de Çerver</a>
        <nav class="breadcrumb">
          <a href="/">Início</a> / <a href="/upload">Upload</a> / Arquivos
        </nav>
      </div>
    </header>
    <div class="main-container">
      <section class="page-title">
        <span class="icon">📁</span>
        <h1>Área de Uploads</h1>
        <p>Visualize e gerencie os arquivos enviados para o servidor.</p>
      </section>
      <section class="uploads-section">{{FILES_LIST}}</section>
      <div style="text-align: center">
        <a href="/upload_form.html" class="btn btn-primary">
          <span>📤</span> Fazer Upload
        </a>
        <a href="/" class="btn btn-secondary">
          <span>🏠</span> Voltar ao Início
        </a>
      </div>
    </div>
    <footer class="footer">
      <strong>C de Çerver Web Server</strong><br />
      Reinaldo Sambinga • Victor Leonel • Ohana Bento
    </footer>
  </body>
</html>
