<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Hello GET</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }

    body {
      height: 100vh;
      background: radial-gradient(circle at top, #6ee7ff, #4f46e5);
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
    }

    .bubble {
      background: rgba(255, 255, 255, 0.18);
      padding: 3rem 4rem;
      border-radius: 40px;
      backdrop-filter: blur(10px);
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.25);
      animation: pop 0.6s ease-out;
    }

    @keyframes pop {
      from {
        transform: scale(0.8);
        opacity: 0;
      }
      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    h1 {
      font-size: 3.5rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      text-shadow: 0 6px 20px rgba(0,0,0,0.35);
    }

    span {
      display: block;
      font-size: 1.1rem;
      opacity: 0.9;
    }
  </style>
</head>

<body>
  <div class="bubble">
    <h1>Hello, world!</h1>
    <span>GET request served successfully 🚀</span>
  </div>
</body>
</html>
